# nginx: принимает запросы на 80-м порту и передаёт их gunicorn; статику отдаёт сам.
# Для HTTPS с доменом:  sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d ваш.домен
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias __APP_DIR__/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
