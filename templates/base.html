<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Платформа ЦФА{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="top-header">
    <div class="top-header__inner">
      <div class="top-header__left">
        <button type="button" class="top-header__market-link" onclick="location.href='{{ url_for('home') }}'">
          <span>Рынок ЦФА</span>
        </button>
      </div>
      <div class="top-header__right">
        {% if me %}
          <span class="top-header__user">{{ me.full_name }}</span>
          {% if me.role == 'ADMIN' %}
          <button type="button" class="top-header__cabinet-btn" onclick="location.href='{{ url_for('admin.dashboard') }}'">
            Админ-панель{% if admin_counts and (admin_counts.users_pending + admin_counts.issues_review) %}
            <span class="header-count">{{ admin_counts.users_pending + admin_counts.issues_review }}</span>{% endif %}
          </button>
          {% else %}
          <button type="button" class="top-header__cabinet-btn" onclick="location.href='{{ url_for('cabinet') }}'">Личный кабинет</button>
          {% endif %}
          <button type="button" class="top-header__logout" onclick="location.href='{{ url_for('logout') }}'">Выйти</button>
        {% else %}
          <button type="button" class="top-header__cabinet-btn" onclick="location.href='{{ url_for('login_page') }}'">Войти на платформу</button>
        {% endif %}
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  {% include "_modals.html" %}
  <div id="toast" class="toast hidden"></div>
  <script>window.ME = {{ ({'role': me.role, 'qualified': me.is_qualified, 'status': me.status} if me else None)|tojson }};</script>
  <script src="{{ url_for('static', filename='analytics.js') }}"></script>
  <script src="{{ url_for('static', filename='dashboards.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
